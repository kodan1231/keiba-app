# 夜間の計算(2026-10-18。docs/design/screens.md「比率の選び方の見直し」)。scripts/pace-nightly.mjs を動かす:
#   1. 総合推奨馬の比率の計算待ちを、Node で採点(D1 を Cloudflare の API で読む)して総当たりで選び、保存
#   2. 同じ馬の組から出す距離の換算の比を1歩ずつ進める
# 以前(2026-10-14〜10-18)は Cloudflare の定時起動(workers/pace-cron。削除済み)が 2 と、比率の山登りを1歩ずつ行っていた。
# 手動でも実行できる(Actions タブの「Run workflow」、または gh workflow run pace-nightly.yml)。
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   KEIBA_BASE_URL    … 管理者用アプリの URL(https://keiba-admin.pages.dev)
#   KEIBA_CRON_SECRET … 管理者用アプリ(Pages の keiba-admin)の秘密情報 PACE_CRON_SECRET と同じ値
#   CF_D1_TOKEN       … D1 を読める Cloudflare の API トークン(管理画面の D1 の使用量と同じトークン。2026-10-19)
# 定時実行は日本時間 3:17 と 4:47 の2回(2026-10-19。GitHub の定時実行は混むと遅れたり飛ばされたりし、10/19 3:00 は始まらなかった。
# 混み合う0分を避け、1回目が飛ばされても2回目で拾う。計算待ちが空なら何もしない)。公開リポジトリは無料。60日間更新が無いと定時実行が止まる。
# 2026-10-20: 22:17・0:47・3:17 の3回に前倒し。10/20 は 3:17 → 7:21、4:47 → 8:06 開始と3〜4時間遅れた。
# 4時間遅れても開催日の朝までに終わるよう夜のうちに始め、3:17 は遅い時間に取り込んだ結果の分を拾う。
name: pace-nightly

on:
  schedule:
    - cron: "17 13 * * *" # UTC 13:17 = 日本時間 22:17
    - cron: "47 15 * * *" # UTC 15:47 = 日本時間 0:47
    - cron: "17 18 * * *" # UTC 18:17 = 日本時間 3:17
  workflow_dispatch:

concurrency:
  group: pace-nightly
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 比率の計算待ちと距離の換算の比を計算して保存
        run: node scripts/pace-nightly.mjs
        env:
          KEIBA_BASE_URL: ${{ secrets.KEIBA_BASE_URL }}
          KEIBA_CRON_SECRET: ${{ secrets.KEIBA_CRON_SECRET }}
          CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
