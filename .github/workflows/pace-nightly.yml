# 総合推奨馬の比率の夜間計算(2026-10-14追加。docs/design/screens.md「比率の計算(夜間・今すぐ計算)」)。
# 毎晩3時(日本時間)に scripts/pace-nightly.mjs を動かす。手動でも実行できる(Actions タブの「Run workflow」)。
# 必要な Secrets(リポジトリの Settings → Secrets and variables → Actions):
#   KEIBA_BASE_URL  … アプリのURL(例: https://xxxx.pages.dev)
#   KEIBA_API_TOKEN … 管理者ユーザーのAPIトークン(管理画面「取り込み」タブで発行)
# GitHub の定時実行は混み具合で数分〜数十分遅れることがある。
name: pace-weights-nightly

on:
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 日本時間 3:00
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 計算待ちの比率を計算して保存
        run: node scripts/pace-nightly.mjs
        env:
          KEIBA_BASE_URL: ${{ secrets.KEIBA_BASE_URL }}
          KEIBA_API_TOKEN: ${{ secrets.KEIBA_API_TOKEN }}
