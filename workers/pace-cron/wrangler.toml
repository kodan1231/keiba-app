# 総合推奨馬の比率の夜間計算の定時起動(2026-10-14追加。src/index.js・docs/design/screens.md「比率の計算(夜間・今すぐ計算)」)。
# アプリ(Cloudflare Pages)とは別の Worker。デプロイ: このフォルダで `npx wrangler deploy`
# 秘密情報: `npx wrangler secret put PACE_CRON_SECRET`(アプリ側にも同じ値を `npx wrangler pages secret put PACE_CRON_SECRET`)
name = "keiba-pace-cron"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false # 外から呼ばれる入口は持たない(定時起動だけ)

[triggers]
# UTC 18:00〜19:50 の10分ごと = 日本時間 3:00〜4:50
crons = ["*/10 18-19 * * *"]

[vars]
KEIBA_BASE_URL = "https://keiba-admin.pages.dev" # 管理者用アプリ(2026-10-14 から夜間計算の受け口は管理者用だけ。docs/design/app-split.md)
