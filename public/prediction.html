<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>レース予想 - 馬券帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
<div id="login-screen" class="screen" hidden><div class="ticket"><p class="ticket-eyebrow">MEMBERS ONLY</p><h1 class="ticket-title">馬券帳</h1><p class="ticket-sub">ユーザー名とパスワードを入力して入場してください</p><form id="login-form"><input type="text" id="login-username" placeholder="ユーザー名" autocomplete="username" required /><input type="password" id="login-password" placeholder="パスワード" autocomplete="current-password" required /><button type="submit" id="login-submit-btn">入場する</button></form><p id="login-error" class="error-text" hidden></p><p id="login-mode-hint" class="ticket-sub" style="font-size:.8em"></p><button type="button" id="login-mode-toggle" class="ghost-btn">初めての方はこちら(新規登録)</button></div></div>
<div id="app-screen" class="screen" hidden>
<header class="masthead"><div class="masthead-inner"><h1 class="masthead-title">馬券帳</h1><nav class="masthead-nav"><a href="index.html" class="nav-link">馬券購入</a><a href="history.html" class="nav-link">馬券履歴</a><a href="stats.html" class="nav-link">集計</a><a href="races.html" class="nav-link" data-admin-only hidden>レース管理</a><a href="admin.html" class="nav-link" data-admin-only hidden>管理</a></nav></div><div class="masthead-actions"><span id="current-username" class="current-username"></span><button id="logout-btn" class="ghost-btn">退場</button></div></header>
<main class="prediction-main">
<section id="prediction-empty" class="empty-state" hidden></section>
<section id="prediction-panel" class="prediction-panel" hidden>
<div id="prediction-race-header" class="prediction-race-header"></div>
<div class="prediction-help">予想印は馬名の横で変更できます。馬をクリックすると、この馬についてのメモだけを入力できます。印とメモは変更時に自動保存されます。</div>
<div id="prediction-horses" class="prediction-horses"></div>
<div id="prediction-tickets" class="prediction-tickets"></div>
</section>
</main></div>
<script src="utils.js"></script><script src="auth.js"></script><script src="bettypes.js"></script><script src="payout.js"></script><script src="prediction.js"></script>
</body></html>
