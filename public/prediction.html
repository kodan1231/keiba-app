<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>レース予想 - 馬券帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="prediction">
<div id="login-screen" class="screen" hidden></div>
<div id="app-screen" class="screen" hidden>
<header class="masthead"></header>
<main class="prediction-main">
<section id="prediction-empty" class="empty-state" hidden></section>
<section id="prediction-panel" class="prediction-panel" hidden>
<div id="prediction-race-header" class="prediction-race-header"></div>
<div class="prediction-help">予想印は馬名の横で変更できます。馬名をクリックすると過去成績(直近5走)を表示し、「メモ」ボタンでこの馬についてのメモを入力できます。印とメモは変更時に自動保存されます。</div>
<div id="prediction-horses" class="prediction-horses"></div>
<div id="prediction-tickets" class="prediction-tickets"></div>
</section>
</main></div>
<!-- 馬メモダイアログ(各馬の「メモ」ボタンから開く。入力は自動保存) -->
<div id="horse-memo-modal" class="modal-overlay" hidden>
  <div class="modal">
    <h2 id="horse-memo-title">馬メモ</h2>
    <textarea id="horse-memo-text" rows="8" maxlength="5000" style="width:100%" aria-label="この馬についてのメモ"></textarea>
    <span id="horse-memo-status" class="horse-note-status" hidden></span>
    <div class="modal-actions">
      <button type="button" id="horse-memo-close-btn" class="stamp-btn">閉じる</button>
    </div>
  </div>
</div>
<script src="utils.js"></script><script src="shell.js"></script><script src="auth.js"></script><script src="cart.js"></script><script src="bettypes.js"></script><script src="payout.js"></script><script src="ticket-view.js"></script><script src="prediction.js"></script>
</body></html>
