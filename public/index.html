<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>馬券購入 - 馬券帳</title><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="style.css"/></head><body data-page="buy">
<div id="login-screen" class="screen" hidden></div>
<div id="app-screen" class="screen" hidden><header class="masthead"></header>
<main class="buy-main"><section class="buy-step"><div class="race-calendar">
  <div class="race-calendar-toolbar">
    <button type="button" id="prev-month-btn" class="ghost-btn">‹</button>
    <strong id="calendar-month-label"></strong>
    <button type="button" id="next-month-btn" class="ghost-btn">›</button>
    <button type="button" id="today-btn" class="ghost-btn">今日</button>
  </div>
  <div id="calendar-grid" class="calendar-grid"></div>
  <input type="hidden" id="date-input" />
</div>
<!-- 競馬場タブ(モバイル専用。PCではCSSで非表示にし、既存の横並びカラム表示のまま)。
     2026-08-16追加: モバイルで全競馬場が横並びに詰め込まれ見づらかったため、
     競馬場単位でタブ切り替えできるようにした(docs/DESIGN.md参照)。 -->
<div id="race-track-tabs" class="race-track-tabs"></div>
<div id="race-grid" class="race-grid"></div><p id="no-race-hint" class="buy-hint" hidden>この日に登録済みのレースがありません。</p></section>
<div id="purchase-modal" class="purchase-modal" hidden><div class="purchase-dialog purchase-dialog-modern" role="dialog" aria-modal="true"><div class="purchase-dialog-head"><div><p class="purchase-kicker">馬券購入</p><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 id="purchase-dialog-title" style="margin:0"></h2><span id="race-settled-badge" hidden style="display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--win);color:#fff;white-space:nowrap">確定済</span></div></div><button id="close-purchase-modal" class="dialog-close">×</button></div>
<div id="race-unconfirmed-block" class="buy-hint" style="margin:0 20px 16px;color:var(--hanko)" hidden>
  このレースは枠番・馬番が未確定のため、購入できません。枠番・馬番確定後(出走馬一覧PDFの再インポート等)に改めてお試しください。
</div>
<div class="purchase-dialog-body">
<section id="bet-type-section" class="purchase-panel"><div id="bet-type-buttons" class="bet-type-tabs"></div></section>
<section id="method-section" class="purchase-panel" hidden><div id="method-buttons" class="choice-grid"></div><div id="method-options" class="method-options"></div></section>
<section id="picker-section" class="purchase-panel" hidden><h3 id="picker-dialog-title">馬を選択</h3><div id="picker-area"></div></section>
<section id="preview-section" class="purchase-panel" hidden><h3>買い目・金額</h3><div class="amount-toolbar"><label>1点あたり<input type="number" id="amount-input" min="100" step="100" value="100"/></label><button id="apply-amount-btn" class="ghost-btn">全点に反映</button></div><div id="preview-area" class="preview-area"></div><button id="submit-btn" class="stamp-btn purchase-submit" disabled>馬券かごへ追加</button><p id="submit-message" class="submit-message" hidden></p></section>
</div></div></div></main></div>
<script src="utils.js"></script><script src="shell.js"></script><script src="bettypes.js"></script><script src="combos.js"></script><script src="auth.js"></script><script src="cart.js"></script>
<!-- 2026-09-01: buy.js をトークン消費削減のため2分割(docs/ROADMAP.md「クラスタI」参照)。
     buy.js(state・カレンダー・レース選択グリッド) → buy-purchase-modal.js(購入モーダル)の順。 -->
<script src="buy.js"></script><script src="buy-purchase-modal.js"></script></body></html>
