<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理 - 馬券帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=202608020540" />
</head>
<body>

<div id="login-screen" class="screen" hidden>
  <div class="ticket">
    <p class="ticket-eyebrow">MEMBERS ONLY</p>
    <h1 class="ticket-title">馬券帳</h1>
    <p class="ticket-sub">ユーザー名とパスワードを入力して入場してください</p>
    <form id="login-form">
      <input type="text" id="login-username" placeholder="ユーザー名" autocomplete="username" required />
      <input type="password" id="login-password" placeholder="パスワード" autocomplete="current-password" required />
      <button type="submit" id="login-submit-btn">入場する</button>
    </form>
    <p id="login-error" class="error-text" hidden></p>
    <p id="login-mode-hint" class="ticket-sub" style="font-size:.8em"></p>
    <button type="button" id="login-mode-toggle" class="ghost-btn">初めての方はこちら(新規登録)</button>
  </div>
</div>

<div id="app-screen" class="screen" hidden>

  <header class="masthead">
    <div class="masthead-inner">
      <h1 class="masthead-title">馬券帳</h1>
      <nav class="masthead-nav"><a href="buy.html" class="nav-link">馬券購入</a><a href="index.html" class="nav-link">馬券履歴</a><a href="stats.html" class="nav-link">集計</a><a href="races.html" class="nav-link">レース管理</a><a href="admin.html" class="nav-link active" data-admin-only hidden>管理</a></nav>
    </div>
    <div class="masthead-actions">
      <span id="current-username" class="current-username"></span>
      <button id="logout-btn" class="ghost-btn">退場</button>
    </div>
  </header>

  <main class="stats-main">
    <p id="admin-denied-notice" class="error-text" hidden>この画面は管理者のみ利用できます。</p>

    <div id="admin-content">
      <section class="stats-section">
        <h2 class="stats-section-title">未登録レース一覧</h2>
        <p class="ticket-sub">CSVインポートで参照されたものの、まだレース登録されていない日付・競馬場・レース番号です。「登録する」から、その内容を引き継いでレース登録画面を開けます。</p>
        <div class="table-wrap"><table class="stats-table" id="unregistered-races-table"></table></div>
      </section>

      <section class="stats-section">
        <h2 class="stats-section-title">登録ユーザー一覧</h2>
        <p class="ticket-sub">閲覧のみです(編集・削除はできません)。管理者にしたい場合は、Cloudflare Pagesの環境変数 ADMIN_USERNAMES にユーザー名を追加してください。</p>
        <div class="table-wrap"><table class="stats-table" id="users-table"></table></div>
      </section>
    </div>
  </main>
</div>

<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
