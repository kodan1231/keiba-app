<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>データ検索 - 馬券帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="data-search">

<div id="login-screen" class="screen" hidden></div>

<div id="app-screen" class="screen" hidden>

  <header class="masthead"></header>

  <main class="stats-main">

    <nav class="stats-tabs">
      <button type="button" class="stats-tab active" data-tab="race-stats">レース成績</button>
      <button type="button" class="stats-tab" data-tab="horse-info">馬情報検索</button>
    </nav>

    <section class="stats-section stats-panel" data-panel="race-stats">

      <div class="ds-filters">
        <label class="ds-filter">
          <span class="ds-filter-label">競馬場</span>
          <select id="ds-track"><option value="">すべて</option></select>
        </label>
        <label class="ds-filter">
          <span class="ds-filter-label">コース</span>
          <select id="ds-surface">
            <option value="">すべて(芝・ダート)</option>
            <option value="芝">芝</option>
            <option value="ダート">ダート</option>
          </select>
        </label>
        <label class="ds-filter">
          <span class="ds-filter-label">距離</span>
          <select id="ds-distance"><option value="">すべて</option></select>
        </label>
      </div>

      <p class="ds-status" id="ds-status" hidden></p>

      <div id="ds-results" hidden>

        <h2 class="stats-heading">単勝・馬連の傾向</h2>
        <p class="stats-note" id="ds-payout-note"></p>
        <div class="overall-grid" id="ds-payout-grid"></div>

        <h2 class="stats-heading">高勝率騎手 トップ5</h2>
        <p class="stats-note" id="ds-jockey-note"></p>
        <div class="table-wrap"><table class="stats-table" id="ds-jockey-win-table"></table></div>

        <h2 class="stats-heading">高複勝率騎手 トップ5</h2>
        <p class="stats-note">複勝率は出走頭数によらず一律「3着以内率」で計算しています。</p>
        <div class="table-wrap"><table class="stats-table" id="ds-jockey-show-table"></table></div>

        <h2 class="stats-heading">馬番別成績</h2>
        <p class="stats-note">大きい馬番は多頭数のレースにしか出走しないため、出走数の母数が小さくなります。</p>
        <div class="table-wrap"><table class="stats-table" id="ds-horse-number-table"></table></div>

      </div>

    </section>

    <!-- 馬情報検索タブ(2026-09-28追加)。仕様はdocs/design/data-search.md「馬情報検索タブ」参照。
         馬齢・性別・過去全出走履歴は自アプリのrace_resultsから、血統・調教師・馬主・生産牧場は
         netkeiba(db.netkeiba.com)から取得してhorsesテーブルにキャッシュしたものを表示する。 -->
    <section class="stats-section stats-panel" data-panel="horse-info" hidden>

      <label class="horse-index-search-label">馬名で検索(部分一致)
        <input type="search" id="hi-search" placeholder="例: イクイノックス" />
      </label>
      <p class="ticket-sub" id="hi-search-status">馬名の一部を入力してください。</p>
      <ul class="hi-result-list" id="hi-result-list" hidden></ul>

      <div id="hi-detail" hidden>
        <h2 class="stats-heading" id="hi-detail-name"></h2>
        <p class="ticket-sub" id="hi-detail-sub"></p>

        <div class="overall-grid" id="hi-master-grid"></div>
        <p class="submit-message" id="hi-fetch-note" hidden></p>

        <div data-admin-only hidden>
          <button type="button" class="ghost-btn" id="hi-refetch-btn">netkeibaから再取得する</button>
          <form id="hi-edit-form" class="form-row" style="flex-wrap:wrap;align-items:flex-end;margin-top:12px">
            <label style="flex:1;min-width:140px">父<input type="text" id="hi-edit-sire" /></label>
            <label style="flex:1;min-width:140px">母<input type="text" id="hi-edit-dam" /></label>
            <label style="flex:1;min-width:140px">母父<input type="text" id="hi-edit-dam_sire" /></label>
            <label style="flex:1;min-width:140px">調教師<input type="text" id="hi-edit-trainer" /></label>
            <label style="flex:1;min-width:140px">馬主<input type="text" id="hi-edit-owner" /></label>
            <label style="flex:1;min-width:140px">生産牧場<input type="text" id="hi-edit-breeder" /></label>
            <button type="submit" class="stamp-btn">保存する</button>
          </form>
          <p id="hi-edit-message" class="submit-message" hidden></p>
        </div>

        <h2 class="stats-heading">過去全出走履歴</h2>
        <div class="table-wrap"><table class="stats-table" id="hi-history-table"></table></div>
      </div>

    </section>

  </main>

</div>

<script src="utils.js"></script>
<script src="shell.js"></script>
<script src="auth.js"></script>
<script src="cart.js"></script>
<script src="data-search.js"></script>
</body>
</html>
